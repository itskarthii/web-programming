<!DOCTYPE html>
<html>
<head> <title>Student Registration Form</title> </head>
<body>
<h2>Student Registration Form</h2>
<form>
<label>Name: </label>
<input type="text" name="name"> <br><br>
<label>Email:</label>
<input type="email" name="enail"> <br><br>
<label>Password:</label>
<input type="password" name="password"> <br><br>
<label>Age:</label>
<input type="number" name="age">
<br><br>
<label>Gender: </label>
<input type="radio" name="gender" value="nale"> Male <input type="radio" name="gender" value="female"> Female
<br><br>
<label>Course: </label>
<select name="course">
<option>MCA</option>
<option>MBA</option>
<option>M.Tech</option>
<option>BCA</option>
</select>
<br><br>
<label>Hobbies: </label>
<input type="checkbox" name "hobby" value="reading"> Reading.
<input type="checkbox" name="hobby" value="sports"> Sports <input type="checkbox" name "hobby" value="music"> Music
<br><br>
<label>Address: </label><br>
<textarea name="address" rows="4" cols="30"></textarea>
<br><br>
<label>Date Date of of Birth: Birth: </label>
<input type="date" name="dob">
<br><br>
<input type="submit" value="Registe
<input type="reset" value="Clear">
</form>
</body>
</html>
