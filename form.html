<!DOCTYPE html>
<html>
<head> <title>Student Registration Form</title> </head>
<body>
<h2>Student Registration Form</h2>
<form>
<label>Name: </label>
<input type="text" name="name"> <br><br>
<label>Email:</label>
<input type="text" email="email"> <br><br>
<label>Password:</label>
<input type="password" name="password"> <br><br>
<label>Age:</label>
<input type="number" name="age">
<br><br>
<label>Gender: </label>
<input type="radio" name="gender" value="nale"> Male 
<input type="radio" name="gender" value="female"> Female
<br><br>
<label>Course: </label>
<select name="course">
<option>MCA</option>
<option>Mcom</option>
<option>M.tech</option>
<option>BCA</option>
</select>
<br><br>
<label>Hobbies: </label>
<input type="checkbox" name "hobby" value="reading"> Reading.
<input type="checkbox" name="hobby" value="sports"> Sports 
<input type="checkbox" name "hobby" value="music"> Music
<input type="checkbox" name "hobby" value="others"> others
<br><br>
<label>Address: </label><br>
<textarea name="address" rows="4" cols="30"></textarea>
<br><br>
<label>Date Date of of Birth: Birth: </label>
<input type="date" name="dob">
<br><br>
<input type="submit" value="register"
<input type="reset" value="clear">
</form>
</body>
</html>
